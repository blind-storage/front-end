name: CI/CD Frontend

on:
  push:
    branches: ['**']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/blind-storage/front-end

jobs:
  # ── Lint: runs on every push ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout front-end
        uses: actions/checkout@v4
        with:
          path: front-end

      - name: Checkout types
        uses: actions/checkout@v4
        with:
          repository: blind-storage/types
          path: types
          ssh-key: ${{ secrets.TYPES_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Build types
        run: cd types && npm ci && npm run build

      - name: Install dependencies
        working-directory: front-end
        run: npm ci

      - name: Lint
        working-directory: front-end
        run: npm run lint

  # ── Build & push: runs on push to main after lint ───────────────────────────
  build-and-push:
    name: Build & Push Image
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout front-end
        uses: actions/checkout@v4
        with:
          path: front-end

      - name: Checkout types
        uses: actions/checkout@v4
        with:
          repository: blind-storage/types
          path: types
          ssh-key: ${{ secrets.TYPES_DEPLOY_KEY }}

      - name: Build types
        run: cd types && npm ci && npm run build

      - name: Copy types into build context
        run: cp -r types front-end/types

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: front-end
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

  # ── Deploy: runs on the server (self-hosted runner) ─────────────────────────
  deploy:
    name: Deploy to Server
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production

    steps:
      - name: Deploy
        run: /opt/blind-storage/scripts/deploy.sh frontend
